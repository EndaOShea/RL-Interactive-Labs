services:
  rl-interactive-labs:
    build:
      context: .
      dockerfile: Dockerfile
    image: rl-interactive-labs:latest
    container_name: rl-interactive-labs
    ports:
      # localhost ONLY — the host reverse proxy (nginx on 443) is the sole
      # public-facing thing and reaches the container here. Never bind 0.0.0.0.
      - "127.0.0.1:2100:2100"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 (not localhost) — nginx binds IPv4 only; inside the container
      # localhost resolves to ::1 first and the probe would get "connection refused".
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.rl-labs.description=RL Interactive Labs Application"
      - "com.rl-labs.version=1.0"

