services:
  rl-interactive-labs:
    build:
      context: .
      dockerfile: Dockerfile
    image: rl-interactive-labs:latest
    container_name: rl-interactive-labs
    ports:
      - "2100:2100"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.rl-labs.description=RL Interactive Labs Application"
      - "com.rl-labs.version=1.0"

