# Content-security headers — single source of truth.
#
# nginx `add_header` is REPLACE-not-merge: any `location` that sets its own
# add_header silently drops every header inherited from the server block. So
# this file is `include`d in the server scope AND in every location that adds
# its own header (static-asset cache-control, health endpoint content-type).
#
# Ownership (per the deployment standard): the container owns the content
# headers below; the host reverse proxy owns HSTS only. Do not add
# Strict-Transport-Security here — that's a TLS-edge concern.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CSP — primary XSS / key-exfiltration backstop. The user's API key lives in the
# browser and is sent directly to whichever LLM provider they pick, so every
# provider host must be listed in connect-src and nowhere broader. These mirror
# the apiHost values in services/providers.ts (Inception is excluded — it is
# server-only and not offered in the UI):
#   - generativelanguage.googleapis.com  (Google Gemini, via @google/genai)
#   - api.openai.com                     (OpenAI)
#   - api.anthropic.com                  (Anthropic Claude)
#   - api.deepseek.com                   (DeepSeek)
# style-src / font-src also allow Google Fonts (fonts.googleapis.com serves the
# @font-face CSS, fonts.gstatic.com serves the woff2 files) for the Space Grotesk
# + IBM Plex typography used by the Cinematic Stage UI.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com https://api.deepseek.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
